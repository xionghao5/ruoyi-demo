<!DOCTYPE html>
<html lang="zh">
<head>
    <th:block th:include="include :: header('AI智能问答')" />
    <link rel="stylesheet" th:href="@{/ajax/libs/highlight/default.min.css}">
    <style>
        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .chat-message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .chat-message.user {
            justify-content: flex-end;
        }
        .chat-message.ai {
            justify-content: flex-start;
        }
        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-message.user .chat-avatar {
            background-color: #1ab394;
            margin-left: 10px;
        }
        .chat-message.ai .chat-avatar {
            background-color: #f8ac59;
            margin-right: 10px;
        }
        .chat-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.6;
        }
        .chat-message.user .chat-bubble {
            background-color: #1ab394;
            color: #fff;
        }
        .chat-message.ai .chat-bubble {
            background-color: #fff;
            color: #333;
            border: 1px solid #e7eaec;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .chat-bubble pre {
            background-color: #f8f8f8;
            border: 1px solid #e7eaec;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
        }
        .chat-bubble code {
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 13px;
        }
        .chat-message.user .chat-bubble code {
            background-color: rgba(255,255,255,0.2);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .chat-message.ai .chat-bubble code {
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .chat-message.ai .chat-bubble pre code {
            background-color: transparent;
            padding: 0;
        }
        .chat-input-area {
            margin-top: 15px;
            display: flex;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            resize: none;
            border-radius: 4px;
            border: 1px solid #e7eaec;
            padding: 10px 15px;
            height: 60px;
            font-size: 14px;
        }
        .chat-input-area .btn-send {
            margin-left: 10px;
            height: 60px;
            padding: 0 25px;
            font-size: 14px;
        }
        .chat-welcome {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }
        .chat-welcome h3 {
            margin-bottom: 10px;
            color: #666;
        }
        .typing-indicator {
            display: none;
            align-items: center;
            padding: 12px 15px;
        }
        .typing-indicator.active {
            display: flex;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5><i class="fa fa-comments"></i> AI智能问答</h5>
                        <div class="ibox-tools">
                            <a class="collapse-link">
                                <i class="fa fa-chevron-up"></i>
                            </a>
                        </div>
                    </div>
                    <div class="ibox-content">
                        <div class="chat-container" id="chatContainer">
                            <div class="chat-welcome" id="chatWelcome">
                                <h3><i class="fa fa-robot"></i> 欢迎使用AI智能问答</h3>
                                <p>请输入您的问题，AI将为您提供智能回答</p>
                            </div>
                        </div>
                        <div class="chat-message ai typing-indicator" id="typingIndicator">
                            <div class="chat-avatar"><i class="fa fa-robot"></i></div>
                            <div class="chat-bubble">
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <textarea id="messageInput" placeholder="请输入您的问题，按Enter发送，Shift+Enter换行..."></textarea>
                            <button type="button" class="btn btn-primary btn-send" id="sendBtn" onclick="sendMessage()">
                                <i class="fa fa-paper-plane"></i> 发送
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script th:src="@{/ajax/libs/highlight/highlight.min.js}"></script>
    <script th:inline="javascript">
        var prefix = ctx + "ai/chat";

        // 配置marked
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: false
            });
        }

        // 发送消息
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var message = input.value.trim();
            if (!message) {
                layer.msg("请输入问题内容", { icon: 5 });
                return;
            }

            // 隐藏欢迎语
            var welcome = document.getElementById('chatWelcome');
            if (welcome) {
                welcome.style.display = 'none';
            }

            // 添加用户消息
            appendUserMessage(message);
            input.value = '';

            // 显示打字指示器
            showTyping(true);

            // 发送请求
            $.ajax({
                type: "POST",
                url: prefix + "/send",
                data: { message: message },
                success: function(result) {
                    showTyping(false);
                    if (result.code === 0) {
                        appendAiMessage(result.data || result.msg);
                    } else {
                        appendAiMessage("抱歉，请求失败：" + (result.msg || "未知错误"));
                    }
                },
                error: function() {
                    showTyping(false);
                    appendAiMessage("抱歉，网络请求异常，请稍后重试。");
                }
            });
        }

        // 添加用户消息
        function appendUserMessage(text) {
            var container = document.getElementById('chatContainer');
            var html = '<div class="chat-message user">' +
                '<div class="chat-bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>' +
                '<div class="chat-avatar"><i class="fa fa-user"></i></div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // 添加AI消息
        function appendAiMessage(text) {
            var container = document.getElementById('chatContainer');
            var content = text;
            if (typeof marked !== 'undefined') {
                content = marked.parse(text);
            } else {
                content = escapeHtml(text).replace(/\n/g, '<br>');
            }
            var html = '<div class="chat-message ai">' +
                '<div class="chat-avatar"><i class="fa fa-robot"></i></div>' +
                '<div class="chat-bubble">' + content + '</div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            // 代码高亮
            if (typeof hljs !== 'undefined') {
                container.querySelectorAll('pre code').forEach(function(block) {
                    hljs.highlightBlock(block);
                });
            }
        }

        // 显示/隐藏打字指示器
        function showTyping(show) {
            var indicator = document.getElementById('typingIndicator');
            if (show) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }

        // 滚动到底部
        function scrollToBottom() {
            var container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // 键盘事件
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
