<!DOCTYPE html>
<html lang="zh">
<head>
    <th:block th:include="include :: header('AI智能问答')" />
    <link rel="stylesheet" th:href="@{/ajax/libs/highlight/default.min.css}">
    <style>
        /* ========== 整体布局 ========== */
        .chat-layout {
            display: flex;
            height: calc(100vh - 120px);
            border: 1px solid #e7eaec;
            border-radius: 4px;
            overflow: hidden;
            background: #fff;
        }

        /* ========== 左侧对话列表 ========== */
        .chat-sidebar {
            width: 260px;
            min-width: 260px;
            border-right: 1px solid #e7eaec;
            display: flex;
            flex-direction: column;
            background-color: #fafafa;
        }
        .chat-sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #e7eaec;
        }
        .chat-sidebar-header .btn-new-chat {
            width: 100%;
        }
        .chat-sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .chat-sidebar-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
            transition: background-color 0.15s;
        }
        .chat-sidebar-item:hover {
            background-color: #f0f0f0;
        }
        .chat-sidebar-item.active {
            background-color: #e8f4f0;
            border-left: 3px solid #1ab394;
        }
        .chat-sidebar-item .conv-title {
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 25px;
        }
        .chat-sidebar-item .conv-time {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }
        .chat-sidebar-item .conv-delete {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
            display: none;
            padding: 4px;
        }
        .chat-sidebar-item:hover .conv-delete {
            display: inline-block;
        }
        .chat-sidebar-item .conv-delete:hover {
            color: #ed5565;
        }
        .chat-sidebar-empty {
            text-align: center;
            color: #bbb;
            padding: 30px 0;
            font-size: 13px;
        }

        /* ========== 右侧聊天区域 ========== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #f5f5f5;
        }
        .chat-message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        .chat-message.user {
            justify-content: flex-end;
        }
        .chat-message.ai {
            justify-content: flex-start;
        }
        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-message.user .chat-avatar {
            background-color: #1ab394;
            margin-left: 10px;
        }
        .chat-message.ai .chat-avatar {
            background-color: #f8ac59;
            margin-right: 10px;
        }
        .chat-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.6;
        }
        .chat-message.user .chat-bubble {
            background-color: #1ab394;
            color: #fff;
        }
        .chat-message.ai .chat-bubble {
            background-color: #fff;
            color: #333;
            border: 1px solid #e7eaec;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .chat-bubble pre {
            background-color: #f8f8f8;
            border: 1px solid #e7eaec;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
        }
        .chat-bubble code {
            font-family: Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 13px;
        }
        .chat-message.user .chat-bubble code {
            background-color: rgba(255,255,255,0.2);
            padding: 2px 4px;
            border-radius: 3px;
        }
        .chat-message.ai .chat-bubble code {
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .chat-message.ai .chat-bubble pre code {
            background-color: transparent;
            padding: 0;
        }
        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #e7eaec;
            background: #fff;
            display: flex;
            align-items: flex-end;
        }
        .chat-input-area textarea {
            flex: 1;
            resize: none;
            border-radius: 4px;
            border: 1px solid #e7eaec;
            padding: 10px 15px;
            height: 60px;
            font-size: 14px;
        }
        .chat-input-area .knowledge-select {
            margin-left: 10px;
            height: 60px;
            min-width: 160px;
            border: 1px solid #e7eaec;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 13px;
            color: #555;
            background-color: #fff;
        }
        .chat-input-area .btn-send {
            margin-left: 10px;
            height: 60px;
            padding: 0 25px;
            font-size: 14px;
        }
        .chat-welcome {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }
        .chat-welcome h3 {
            margin-bottom: 10px;
            color: #666;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out both;
            display: inline-block;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="gray-bg">
    <div class="wrapper wrapper-content">
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5><i class="fa fa-comments"></i> AI智能问答</h5>
                        <div class="ibox-tools">
                            <a class="collapse-link">
                                <i class="fa fa-chevron-up"></i>
                            </a>
                        </div>
                    </div>
                    <div class="ibox-content" style="padding: 0;">
                        <div class="chat-layout">
                            <!-- 左侧对话列表 -->
                            <div class="chat-sidebar">
                                <div class="chat-sidebar-header">
                                    <button type="button" class="btn btn-primary btn-new-chat" onclick="newConversation()">
                                        <i class="fa fa-plus"></i> 新增对话
                                    </button>
                                </div>
                                <div class="chat-sidebar-list" id="conversationList">
                                    <div class="chat-sidebar-empty" id="convEmpty">
                                        <i class="fa fa-comments"></i><br>暂无对话记录
                                    </div>
                                </div>
                            </div>
                            <!-- 右侧聊天区域 -->
                            <div class="chat-main">
                                <div class="chat-container" id="chatContainer">
                                    <div class="chat-welcome" id="chatWelcome">
                                        <h3><i class="fa fa-robot"></i> 欢迎使用AI智能问答</h3>
                                        <p>请输入您的问题，AI将为您提供智能回答</p>
                                    </div>
                                </div>
                                <div class="chat-input-area">
                                    <textarea id="messageInput" placeholder="请输入您的问题，按Enter发送，Shift+Enter换行..."></textarea>
                                    <select id="knowledgeSelect" class="knowledge-select" title="选择知识库">
                                        <option value="">不使用知识库</option>
                                    </select>
                                    <button type="button" class="btn btn-primary btn-send" id="sendBtn" onclick="sendMessage()">
                                        <i class="fa fa-paper-plane"></i> 发送
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script th:src="@{/ajax/libs/highlight/highlight.min.js}"></script>
    <script th:inline="javascript">
        var prefix = ctx + "ai/chat";
        var knowledgePrefix = ctx + "ai/knowledge";

        // 当前对话ID（null表示新对话）
        var currentConversationId = null;

        // 配置marked
        if (typeof marked !== 'undefined') {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: false
            });
        }

        // ========== 页面加载时获取对话列表和知识库列表 ==========
        $(document).ready(function() {
            loadConversationList();
            loadKnowledgeList();
        });

        // ========== 加载对话列表 ==========
        function loadConversationList() {
            $.ajax({
                type: "GET",
                url: prefix + "/list",
                data: { pageNum: 1, pageSize: 50 },
                success: function(result) {
                    var list = result.rows || [];
                    renderConversationList(list);
                },
                error: function() {
                    layer.msg("加载对话列表失败", { icon: 5 });
                }
            });
        }

        // ========== 加载知识库列表 ==========
        function loadKnowledgeList() {
            $.ajax({
                type: "GET",
                url: knowledgePrefix + "/all",
                success: function(result) {
                    var list = result.data || [];
                    var select = document.getElementById('knowledgeSelect');
                    // 清除旧选项（保留第一个默认选项）
                    select.options.length = 1;
                    for (var i = 0; i < list.length; i++) {
                        var kb = list[i];
                        var option = new Option(kb.knowledgeName, kb.knowledgeId);
                        select.add(option);
                    }
                },
                error: function() {
                    // 静默失败，不影响主要功能
                }
            });
        }

        // ========== 渲染对话列表 ==========
        function renderConversationList(list) {
            var container = document.getElementById('conversationList');
            var emptyEl = document.getElementById('convEmpty');

            // 移除旧的对话项（保留空提示）
            var items = container.querySelectorAll('.chat-sidebar-item');
            items.forEach(function(item) { item.remove(); });

            if (!list || list.length === 0) {
                if (emptyEl) emptyEl.style.display = '';
                return;
            }
            if (emptyEl) emptyEl.style.display = 'none';

            for (var i = 0; i < list.length; i++) {
                var conv = list[i];
                var itemHtml = '<div class="chat-sidebar-item' + (conv.conversationId == currentConversationId ? ' active' : '') + '" '
                    + 'data-id="' + conv.conversationId + '" '
                    + 'onclick="switchConversation(' + conv.conversationId + ')">'
                    + '<div class="conv-title" title="' + escapeHtml(conv.title) + '">' + escapeHtml(conv.title) + '</div>'
                    + '<div class="conv-time">' + (conv.createTime || '') + '</div>'
                    + '<span class="conv-delete" onclick="event.stopPropagation();deleteConversation(' + conv.conversationId + ')" title="删除对话"><i class="fa fa-trash-o"></i></span>'
                    + '</div>';
                container.insertAdjacentHTML('beforeend', itemHtml);
            }
        }

        // ========== 新增对话 ==========
        function newConversation() {
            currentConversationId = null;
            // 清空聊天区域
            var chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = '<div class="chat-welcome" id="chatWelcome">'
                + '<h3><i class="fa fa-robot"></i> 欢迎使用AI智能问答</h3>'
                + '<p>请输入您的问题，AI将为您提供智能回答</p>'
                + '</div>';
            // 清除列表选中状态
            var items = document.querySelectorAll('.chat-sidebar-item');
            items.forEach(function(item) { item.classList.remove('active'); });
            // 聚焦输入框
            document.getElementById('messageInput').focus();
        }

        // ========== 切换对话 ==========
        function switchConversation(conversationId) {
            if (conversationId == currentConversationId) return;
            currentConversationId = conversationId;

            // 更新列表选中状态
            var items = document.querySelectorAll('.chat-sidebar-item');
            items.forEach(function(item) {
                if (item.dataset.id == conversationId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 加载该对话的消息历史
            loadMessages(conversationId);
        }

        // ========== 加载对话消息历史 ==========
        function loadMessages(conversationId) {
            $.ajax({
                type: "GET",
                url: prefix + "/messages",
                data: { conversationId: conversationId },
                success: function(result) {
                    var chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = '';

                    var messages = result.data || [];
                    if (messages.length === 0) {
                        chatContainer.innerHTML = '<div class="chat-welcome"><h3><i class="fa fa-robot"></i> 欢迎使用AI智能问答</h3><p>请输入您的问题，AI将为您提供智能回答</p></div>';
                        return;
                    }

                    for (var i = 0; i < messages.length; i++) {
                        var msg = messages[i];
                        if (msg.role === 'user') {
                            appendUserMessage(msg.content);
                        } else if (msg.role === 'assistant') {
                            appendAiMessage(msg.content);
                        }
                    }
                    scrollToBottom();
                },
                error: function() {
                    layer.msg("加载消息历史失败", { icon: 5 });
                }
            });
        }

        // ========== 删除对话 ==========
        function deleteConversation(conversationId) {
            layer.confirm('确认删除该对话？删除后不可恢复。', { icon: 3, title: '提示' }, function(index) {
                $.ajax({
                    type: "POST",
                    url: prefix + "/delete",
                    data: { conversationId: conversationId },
                    success: function(result) {
                        if (result.code === 0) {
                            layer.msg("删除成功", { icon: 1 });
                            // 如果删除的是当前对话，则新建对话
                            if (conversationId == currentConversationId) {
                                newConversation();
                            }
                            // 重新加载列表
                            loadConversationList();
                        } else {
                            layer.msg(result.msg || "删除失败", { icon: 5 });
                        }
                    },
                    error: function() {
                        layer.msg("删除请求失败", { icon: 5 });
                    }
                });
                layer.close(index);
            });
        }

        // ========== 发送消息 ==========
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var message = input.value.trim();
            if (!message) {
                layer.msg("请输入问题内容", { icon: 5 });
                return;
            }

            // 隐藏欢迎语
            var welcome = document.getElementById('chatWelcome');
            if (welcome) {
                welcome.style.display = 'none';
            }

            // 添加用户消息
            appendUserMessage(message);
            input.value = '';

            // 添加AI消息气泡（初始为空，流式填充内容）
            var aiMsgId = appendAiMessageEmpty();

            // 禁用发送按钮
            var sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            // 使用fetch接收SSE流式响应
            var params = new URLSearchParams();
            params.append('message', message);
            if (currentConversationId) {
                params.append('conversationId', currentConversationId);
            }
            // 添加知识库ID
            var knowledgeId = document.getElementById('knowledgeSelect').value;
            if (knowledgeId) {
                params.append('knowledgeId', knowledgeId);
            }

            fetch(prefix + '/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            }).then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP error ' + response.status);
                }
                var reader = response.body.getReader();
                var decoder = new TextDecoder('utf-8');
                var buffer = '';
                var fullContent = '';

                function read() {
                    reader.read().then(function(result) {
                        if (result.done) {
                            // 流结束，渲染最终内容
                            finalizeAiMessage(aiMsgId, fullContent);
                            sendBtn.disabled = false;
                            return;
                        }

                        buffer += decoder.decode(result.value, { stream: true });
                        // 按换行分割处理SSE数据
                        var lines = buffer.split('\n');
                        // 最后一段可能不完整，保留在buffer中
                        buffer = lines.pop();

                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i].trim();

                            // 处理 conversation 事件：后端返回新建对话的ID
                            if (line === 'event:conversation') {
                                // 下一个 data 行是对话ID
                                continue;
                            }
                            if (line.startsWith('data:') && i > 0 && lines[i-1].trim() === 'event:conversation') {
                                var convIdData = line.substring(5).trim();
                                if (convIdData) {
                                    currentConversationId = parseInt(convIdData);
                                    // 刷新对话列表
                                    loadConversationList();
                                }
                                continue;
                            }

                            if (line === 'event:message') {
                                continue;
                            }
                            if (line.startsWith('data:')) {
                                var data = line.substring(5);
                                if (data === '[DONE]') {
                                    // 流结束
                                    finalizeAiMessage(aiMsgId, fullContent);
                                    sendBtn.disabled = false;
                                    return;
                                }
                                if (data) {
                                    fullContent += data;
                                    updateAiMessage(aiMsgId, fullContent);
                                }
                            } else if (line === 'event:error') {
                                // 下一个data行是错误信息
                            }
                        }

                        read();
                    }).catch(function(error) {
                        if (!fullContent) {
                            fullContent = '抱歉，网络请求异常，请稍后重试。';
                            updateAiMessage(aiMsgId, fullContent);
                        }
                        finalizeAiMessage(aiMsgId, fullContent);
                        sendBtn.disabled = false;
                    });
                }

                read();
            }).catch(function(error) {
                updateAiMessage(aiMsgId, '抱歉，网络请求异常，请稍后重试。');
                finalizeAiMessage(aiMsgId, '抱歉，网络请求异常，请稍后重试。');
                sendBtn.disabled = false;
            });
        }

        // ========== 添加用户消息 ==========
        function appendUserMessage(text) {
            var container = document.getElementById('chatContainer');
            var html = '<div class="chat-message user">' +
                '<div class="chat-bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>' +
                '<div class="chat-avatar"><i class="fa fa-user"></i></div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // ========== 添加AI消息（空气泡，用于流式填充） ==========
        function appendAiMessageEmpty() {
            var container = document.getElementById('chatContainer');
            var msgId = 'ai-msg-' + Date.now();
            var html = '<div class="chat-message ai" id="' + msgId + '">' +
                '<div class="chat-avatar"><i class="fa fa-robot"></i></div>' +
                '<div class="chat-bubble"><span class="ai-content"></span><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return msgId;
        }

        // ========== 更新AI消息内容（流式追加） ==========
        function updateAiMessage(msgId, text) {
            var msgEl = document.getElementById(msgId);
            if (!msgEl) return;
            var contentEl = msgEl.querySelector('.ai-content');
            if (contentEl) {
                contentEl.innerText = text;
            }
            scrollToBottom();
        }

        // ========== 最终渲染AI消息（流结束后做markdown渲染） ==========
        function finalizeAiMessage(msgId, text) {
            var msgEl = document.getElementById(msgId);
            if (!msgEl) return;
            var bubbleEl = msgEl.querySelector('.chat-bubble');
            if (bubbleEl) {
                var content = text;
                if (typeof marked !== 'undefined') {
                    content = marked.parse(text);
                } else {
                    content = escapeHtml(text).replace(/\n/g, '<br>');
                }
                bubbleEl.innerHTML = content;
            }
            scrollToBottom();
            if (typeof hljs !== 'undefined') {
                var container = document.getElementById('chatContainer');
                container.querySelectorAll('pre code').forEach(function(block) {
                    hljs.highlightBlock(block);
                });
            }
        }

        // ========== 添加AI消息（完整内容，用于历史消息） ==========
        function appendAiMessage(text) {
            var container = document.getElementById('chatContainer');
            var content = text;
            if (typeof marked !== 'undefined') {
                content = marked.parse(text);
            } else {
                content = escapeHtml(text).replace(/\n/g, '<br>');
            }
            var html = '<div class="chat-message ai">' +
                '<div class="chat-avatar"><i class="fa fa-robot"></i></div>' +
                '<div class="chat-bubble">' + content + '</div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
            // 代码高亮
            if (typeof hljs !== 'undefined') {
                container.querySelectorAll('pre code').forEach(function(block) {
                    hljs.highlightBlock(block);
                });
            }
        }

        // ========== 滚动到底部 ==========
        function scrollToBottom() {
            var container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // ========== HTML转义 ==========
        function escapeHtml(text) {
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ========== 键盘事件 ==========
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
